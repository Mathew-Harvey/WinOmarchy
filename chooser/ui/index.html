<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Winmarchy</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage">
    <section class="half" id="half-win11" data-mode="win11" tabindex="-1">
      <div class="backdrop">
        <img id="win11-shot" alt="" hidden>
        <div id="win11-fallback">
          <div class="winlogo">
            <span></span><span></span><span></span><span></span>
          </div>
        </div>
      </div>
      <div class="veil"></div>
      <div class="half-label">
        <h2>Windows 11</h2>
        <p>Everything exactly as you left it</p>
      </div>
    </section>

    <div id="divider"></div>

    <section class="half" id="half-omarchy" data-mode="omarchy" tabindex="-1">
      <div class="backdrop" id="omarchy-backdrop">
        <div class="mock-bar">
          <div class="ws">
            <i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
          </div>
          <span class="mock-clock">Fri 01 Aug 21:34</span>
          <span class="mock-stats">cpu 4% &nbsp; mem 31%</span>
        </div>
        <div class="mock-tiles">
          <div class="tile focused">
            <span class="line w60"></span><span class="line w80"></span>
            <span class="line w40"></span><span class="line prompt"></span>
          </div>
          <div class="tile-col">
            <div class="tile">
              <span class="line w80"></span><span class="line w60"></span>
            </div>
            <div class="tile">
              <span class="line w40"></span><span class="line w60"></span>
            </div>
          </div>
        </div>
      </div>
      <div class="veil"></div>
      <div class="half-label">
        <h2>Omarchy</h2>
        <p>Tiling windows, one palette, the keyboard first</p>
      </div>
    </section>
  </div>

  <footer>
    <div id="countdown">
      <svg viewBox="0 0 44 44" width="44" height="44">
        <circle class="ring-track" cx="22" cy="22" r="19"></circle>
        <circle class="ring" id="ring" cx="22" cy="22" r="19"></circle>
      </svg>
      <span id="count-num">5</span>
    </div>
    <p id="countdown-text">Continuing shortly</p>
    <label id="dont-ask-label">
      <input type="checkbox" id="dont-ask">
      Don't ask at login (swap from the menu any time)
    </label>
  </footer>

  <div id="fade-overlay"></div>
  <script src="app.js"></script>
</body>
</html>
